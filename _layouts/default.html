<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
      <style>
        body {color: #595959;}
        p.description {text-align: center; font-size: 12px; color: #727272;}
        h1.title {text-align: center;}
        a:hover, a:focus {font-weight: inherit; text-decoration: underline;}
        section h2 {margin-top: 28px; margin-bottom: 12px;}
        section h1:not(:first-child) {margin-top: 40px;}
        section #other-interests {border-top: 1px solid #e5e5e5; padding-top: 28px;}

        @media screen and (min-width: 961px) {
          .wrapper {width: 1000px; max-width: 100%;}
          section {width: calc(100% - 340px);}
        }
      </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="title"><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        {% if site.logo %}
          <img src="{{site.logo | relative_url}}" alt="Nujabes album art" />
        {% endif %}

        <p class="description">{{ site.description | default: site.github.project_tagline }}</p>
      </header>
      <section>

      {{ content }}

      </section>
      <footer>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
